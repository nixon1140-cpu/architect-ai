version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: architectai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: architectai-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # ホストのOllamaに実際に取得済みのタグへ変更（Web版Claude承認済み。Step1固定内容からの変更）。
      OLLAMA_MODEL: gemma4:e4b-it-q4_K_M
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Windows/Mac Docker Desktop resolves this automatically.
    # Kept explicit so the same compose file also works unmodified on Linux hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
    container_name: architectai-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "4500:3000"

volumes:
  db_data:
